
name: Build and publish rootless DEB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1

      - name: Build rootless .deb
        run: make clean package FINALPACKAGE=1

      - name: Verify .deb was built
        shell: bash
        run: |
          ls -lh packages/*.deb
          test -n "$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"

      - name: Publish direct .deb download
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: MusicCapture17 build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: packages/*.deb
          fail_on_unmatched_files: true
